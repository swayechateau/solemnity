services:
  website:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.solemnity-website.rule=Host(`solemnity.icu`)"
    networks:
      - default

networks:
  default:
    external: true
    name: proxy_default
